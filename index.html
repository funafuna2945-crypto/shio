<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c3854">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="潮流予報">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>紀伊水道・伊島 潮流・風予報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  color-scheme: dark;
  --band:#1c3854;      /* 見出しと凡例の帯 */
  --land:#33506e;      /* 陸 */
  --border:#56748f;    /* 県境 */
  --box:rgba(35,57,83,.93);
  --text:#ffffff;
  --sub:#c7d6e4;
  --date:#5fb4ff;
  --hour:#f6b73c;
  --wh:#63c1ff;
  --off:#45d4a8;--on:#ff7a59;--side:#8fb4ff;
  --jp:"M PLUS 1p","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--band);color:var(--text);font-family:var(--jp);-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}

/* 見出し帯 */
.head{position:relative;padding:12px 16px 10px;background:var(--band);z-index:10}
.head h1{margin:0;font-size:clamp(19px,5.6vw,26px);font-weight:800;letter-spacing:.02em;line-height:1.25}
.head .date{color:var(--date);font-weight:700;font-size:clamp(15px,4.4vw,19px);margin-top:2px}
.head .hour{position:absolute;right:16px;bottom:4px;color:var(--hour);font-weight:800;font-size:clamp(38px,11vw,52px);line-height:1}
.tools{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:12px;color:var(--sub)}
.seg{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden}
.seg button,.icon{all:unset;cursor:pointer;padding:4px 11px;font-size:12px;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--band);font-weight:700}
.icon{border:1px solid var(--border);border-radius:999px}
button:focus-visible,#slider:focus-visible{outline:2px solid var(--hour);outline-offset:2px}

/* 地図 */
#map{flex:1;min-height:0;background:#2b4a68}
.leaflet-container{background:#2b4a68;font-family:var(--jp)}
.leaflet-control-attribution{background:rgba(28,56,84,.75)!important;color:var(--sub)!important;font-size:9px}
.leaflet-control-attribution a{color:var(--sub)!important}

/* 地点 */
.spot{background:none;border:none}
.call{position:relative;width:0;height:0}
.call .nm{position:absolute;left:9px;top:-9px;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer;text-shadow:0 0 3px #1c3854,0 0 3px #1c3854,0 0 2px #1c3854}
.ktp{position:absolute;left:0;top:0;background:rgba(28,56,84,.94);border:1px solid var(--border);border-radius:8px;padding:4px 6px 2px;width:max-content;cursor:pointer}
.ktp .cap{font-size:10px;color:var(--sub);margin-bottom:2px}
.ktp .r{display:block;line-height:1.35}
.ktp .r b{font-size:12px}
.ktp .kt{display:flex;align-items:center;gap:2px;font-size:15px;font-weight:800;margin:0 0 3px 0;white-space:nowrap}
.ktp .kt .dr{font-size:11px;font-weight:700;margin-left:2px}
.ktp .l1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ktp .td{font-size:11px;font-weight:700}
.ktp .kt i{width:10px;height:10px;border-radius:2px}
.ktp .kt em{font-style:normal;font-size:11px;font-weight:800;margin-left:-1px}
.ktp .kt small{font-size:9px;font-weight:700}
.call .nm.l{left:auto;right:9px}
.call::before{content:'';position:absolute;left:-14px;top:-14px;width:28px;height:28px;cursor:pointer}
.call .dot{position:absolute;left:-5px;top:-5px;width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(28,56,84,.6);z-index:2}

/* 凡例と時刻 */
.foot{background:var(--band);padding:8px 16px calc(env(safe-area-inset-bottom,0px) + 10px);font-size:12px;color:var(--sub);z-index:10}
.row{display:flex;align-items:center;gap:12px}
#play{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;background:var(--text);color:var(--band);display:grid;place-items:center;font-size:14px;flex:none}
#slider{flex:1;accent-color:var(--hour);height:26px}
.days{position:relative;height:14px;margin:0 8px 0 56px;font-size:11px}
.days span{position:absolute;white-space:nowrap}
.lg[hidden]{display:none}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{all:unset;cursor:pointer;flex:1;text-align:center;border:1px solid var(--border);border-radius:8px;padding:5px 2px;font-size:12px;color:var(--sub);line-height:1.35}
.tabs button b{display:block;font-size:14px;color:var(--text)}
.tabs button span{color:var(--hour)}
.tabs button[aria-selected="true"]{background:var(--text);color:var(--band);border-color:var(--text)}
.tabs button[aria-selected="true"] b{color:var(--band)}
.tabs button[aria-selected="true"] span{color:#b5650d}
.tabs button:focus-visible{outline:2px solid var(--hour);outline-offset:2px}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;align-items:center}
.lg i{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.bar{display:inline-flex;margin:0 6px;vertical-align:middle}
.bar i{width:15px;height:9px;border-radius:0;margin:0}
.small{font-size:11px;margin-top:4px;line-height:1.5}

/* 詳細シート */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:2000;max-height:82%;overflow-y:auto;background:var(--band);
  border-top:1px solid var(--border);border-radius:16px 16px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 18px);
  transform:translateY(105%);transition:transform .25s ease}
#sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
.sh-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sh-head h2{margin:0;font-size:22px;font-weight:800}
.sh-head .face{font-size:12px;color:var(--sub)}
.now{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px;margin:14px 0 6px}
.now div{border-left:2px solid var(--border);padding-left:8px}
.now .k{font-size:11px;color:var(--sub)}
.now .v{font-weight:800;font-size:24px;line-height:1.1}
.now .v small{font-size:12px;font-weight:400;margin-left:2px}
.now .s{font-size:12px}
.tag{display:inline-block;border-radius:4px;padding:1px 6px;font-size:12px;font-weight:700;color:var(--band)}
/* 今日の釣り判断 */
.judge{margin:12px 0 4px;border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.judge .jh{font-size:12px;color:var(--sub)}
.judge .shio{display:flex;align-items:baseline;gap:10px;margin:2px 0 6px}
.judge .shio b{font-size:22px;font-weight:800;color:var(--hour)}
.judge .shio span{font-size:12px;color:var(--sub)}
.judge .jt{font-size:11px;color:var(--sub);margin-top:6px}
.judge ul{list-style:none;margin:2px 0 0;padding:0;font-size:14px;line-height:1.7}
.judge li b{font-weight:800;margin-right:4px}
h3{font-size:13px;color:var(--sub);font-weight:400;margin:18px 0 6px}
.chart{position:relative;height:150px}
.tides{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;margin-top:6px}
.tides b{font-size:17px}
.note{font-size:11px;color:var(--sub);margin-top:14px;line-height:1.6}
.danger{all:unset;cursor:pointer;font-size:12px;color:var(--on);margin-top:12px;display:inline-block}

#msg{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);z-index:1500;background:var(--band);border:1px solid var(--border);
  border-radius:10px;padding:14px 18px;font-size:14px;max-width:84%;text-align:center;line-height:1.6}
#msg[hidden]{display:none}
</style>
</head>
<body>
<header class="head">
  <h1 id="title"></h1>
  <div class="date" id="date">—</div>
  <div class="tools">
    <div class="seg" role="group" aria-label="矢印の表示">
      <button data-mode="current" aria-pressed="true">潮流</button>
      <button data-mode="wind" aria-pressed="false">風</button>
    </div>
    <button class="icon" id="refresh">更新</button><span id="updated"></span>
  </div>
  <div class="hour" id="hour">--時</div>
</header>

<div id="map" aria-label="波高と風の地図"></div>

<footer class="foot">
  <div class="tabs" id="tabs" role="tablist" aria-label="日付"></div>
  <div class="days" id="days"></div>
  <div class="row"><button id="play" aria-label="再生">▶</button><input id="slider" type="range" min="0" max="0" value="0" aria-label="時刻"></div>
  <div class="lg" id="lgWind" hidden><span><i style="background:#5ea8ff"></i>青：微風 〜2m</span><span><i style="background:#5fd27a"></i>緑：そこそこ 3〜5m</span><span><i style="background:#ff7a59"></i>赤：強風 6m〜</span></div>
  <div class="lg"><span>海の色＝潮の速さ　0<span class="bar" id="bar"></span>2ノット〜</span></div>
  <div class="small" id="arrowNote">白矢印は潮の流れていく向き　浜をタップで詳細、地図を長押しで地点を追加</div>
</footer>

<section id="sheet" aria-live="polite"></section>
<div id="msg" hidden></div>

function shore(from,face,speed){
  if(face==null)return{t:'',c:'',raw:windColor(speed)};
  if(speed<2)return{t:'ほぼ無風',c:'#8fb4ff'};
  const d=angDiff(from,face);
  if(d<=60)return{t:'オンショア',c:'var(--on)',raw:'#ff7a59'};
  if(d>=120)return{t:'オフショア',c:'var(--off)',raw:'#45d4a8'};
  return{t:'サイド',c:'var(--side)',raw:'#8fb4ff'};
}

/* ---------- 取得 ---------- */
async function getJSON(url){const r=await fetch(url);if(!r.ok){let m='';try{m=(await r.json()).reason||''}catch(e){}throw new Error(`HTTP ${r.status} ${m}`);}return r.json();}
const arr=j=>Array.isArray(j)?j:[j];
const common=`&timezone=${encodeURIComponent(TZ)}&forecast_days=${DAYS}`;
function toMS(u){u=(u||'').toLowerCase();if(u.includes('km'))return 1/3.6;if(u.includes('kn'))return 0.5144;if(u.includes('mph'))return 0.447;return 1;}

async function fetchGrid(force){
  const c=store.get(KEY_GRID);
  if(!force&&c&&Date.now()-c.at<CACHE_MIN*6e4&&c.n===G.lats.length)return c;
  const loc=`latitude=${G.lats.join(',')}&longitude=${G.lons.join(',')}`;
  const [m,w]=await Promise.all([
    getJSON(`https://marine-api.open-meteo.com/v1/marine?${loc}&hourly=ocean_current_velocity,ocean_current_direction&cell_selection=nearest${common}`),
    getJSON(`https://api.open-meteo.com/v1/forecast?${loc}&hourly=wind_speed_10m,wind_direction_10m&wind_speed_unit=ms${common}`)
  ]);
  const M=arr(m),W=arr(w),k=toMS(M[0].hourly_units?.ocean_current_velocity);
  const g={at:Date.now(),n:G.lats.length,times:M[0].hourly.time,
    curS:M.map(p=>p.hourly.ocean_current_velocity.map(v=>v==null?null:+(v*k).toFixed(3))),curD:M.map(p=>p.hourly.ocean_current_direction),
    winS:W.map(p=>p.hourly.wind_speed_10m),winD:W.map(p=>p.hourly.wind_direction_10m)};
  store.set(KEY_GRID,g);return g;
}
async function fetchSpots(force){
  const spots=[...SPOTS_DEFAULT,...customSpots().map(s=>({...s,custom:true}))];
  const sig=spots.map(s=>`${s.lat},${s.lon}`).join('|');
  const c=store.get(KEY_SPOT);
  if(!force&&c&&c.sig===sig&&Date.now()-c.at<CACHE_MIN*6e4)return{spots,data:c.data};
  const loc=`latitude=${spots.map(s=>s.lat).join(',')}&longitude=${spots.map(s=>s.lon).join(',')}`;
  const [m,w]=await Promise.all([
    getJSON(`https://marine-api.open-meteo.com/v1/marine?${loc}&hourly=wave_height,wave_direction,wave_period,swell_wave_height,swell_wave_direction,swell_wave_period,ocean_current_velocity,ocean_current_direction,sea_level_height_msl,sea_surface_temperature&cell_selection=sea${common}`),
    getJSON(`https://api.open-meteo.com/v1/forecast?${loc}&hourly=wind_speed_10m,wind_direction_10m,wind_gusts_10m&daily=sunrise,sunset&wind_speed_unit=ms${common}`)
  ]);
  const M=arr(m),W=arr(w);
  const data=M.map((p,i)=>{const k=toMS(p.hourly_units?.ocean_current_velocity);return{...p.hourly,...W[i].hourly,sun:W[i].daily||null,
    ocean_current_velocity:p.hourly.ocean_current_velocity.map(v=>v==null?null:v*k)}});
  store.set(KEY_SPOT,{at:Date.now(),sig,data});return{spots,data};
}

/* ---------- 格子の補間 ---------- */
function dilate(a,iters){ // 海岸沿いの空白を周りの海の値で埋める（陸は上から塗るので見えない）
  for(let k=0;k<iters;k++){const b=a.slice();
    for(let r=0;r<G.nLat;r++)for(let c=0;c<G.nLon;c++){const i=r*G.nLon+c;if(!Number.isNaN(a[i]))continue;let s=0,n=0;
      for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const rr=r+dr,cc=c+dc;if(rr<0||cc<0||rr>=G.nLat||cc>=G.nLon)continue;const v=a[rr*G.nLon+cc];if(!Number.isNaN(v)){s+=v;n++;}}
      if(n)b[i]=s/n;}
    a=b;}
  return a;
}
function field(t){
  if(S.fieldCache.has(t))return S.fieldCache.get(t);
  const g=S.grid,n=G.lats.length,F32=()=>new Float32Array(n);
  const f={cr:F32(),wu:F32(),wv:F32(),cu:F32(),cv:F32()};
  for(let i=0;i<n;i++){
    const ws=g.winS[i][t],wdd=g.winD[i][t];
    if(ws==null){f.wu[i]=f.wv[i]=NaN}else{const r=(wdd+180)*Math.PI/180;f.wu[i]=ws*Math.sin(r);f.wv[i]=ws*Math.cos(r);} // 風の吹いていく向き
    const cs=g.curS[i][t],cd=g.curD[i][t];
    if(cs==null||cd==null){f.cu[i]=f.cv[i]=f.cr[i]=NaN}else{const r=cd*Math.PI/180;f.cu[i]=cs*Math.sin(r);f.cv[i]=cs*Math.cos(r);f.cr[i]=cs/0.5144;} // 潮の流れていく向き・ノット
  }
  f.cs=dilate(f.cr,2);
  S.fieldCache.set(t,f);return f;
}
function fieldAt(x){ // x は小数つきの時刻（例 5.5 = 5時30分）
  const h=Math.floor(x),f=+(x-h).toFixed(4);
  if(f===0||h+1>=S.times.length)return field(Math.min(h,S.times.length-1));
  const key='m'+x.toFixed(4);if(S.fieldCache.has(key))return S.fieldCache.get(key);
  const A=field(h),B=field(h+1),o={};
  for(const k of Object.keys(A)){const a=A[k],b=B[k],r=new Float32Array(a.length);
    for(let i=0;i<a.length;i++){const va=a[i],vb=b[i];r[i]=Number.isNaN(va)?vb:Number.isNaN(vb)?va:va+(vb-va)*f;}o[k]=r;}
  S.fieldCache.set(key,o);return o;
}
function sample(a,lat,lon,minW){
  const fr=(lat-G.latMin)/G.step,fc=(lon-G.lonMin)/G.step;
  if(fr<0||fc<0||fr>G.nLat-1||fc>G.nLon-1)return NaN;
  const r0=Math.floor(fr),c0=Math.floor(fc),r1=Math.min(r0+1,G.nLat-1),c1=Math.min(c0+1,G.nLon-1),dr=fr-r0,dc=fc-c0;
  let s=0,ws=0;
  for(const [r,c,w] of [[r0,c0,(1-dr)*(1-dc)],[r0,c1,(1-dr)*dc],[r1,c0,dr*(1-dc)],[r1,c1,dr*dc]]){const v=a[r*G.nLon+c];if(!Number.isNaN(v)){s+=v*w;ws+=w;}}
  return ws>=minW?s/ws:NaN;
}

function arrow(c,x,y,ux,uy,len,color,width){ // ux,uy: 東・北向きの単位ベクトル

const SHIO=['大潮','大潮','大潮','中潮','中潮','中潮','中潮','小潮','小潮','小潮','長潮','若潮','中潮','中潮','大潮','大潮','大潮','大潮','中潮','中潮','中潮','中潮','小潮','小潮','小潮','長潮','若潮','中潮','中潮','大潮'];
function moonAge(y,m,d){ // その日の正午（日本時間）の月齢
  const t=Date.UTC(y,m-1,d,3,0,0),nm=Date.UTC(2000,0,6,18,14,0),syn=29.530588853;
  return (((t-nm)/864e5)%syn+syn)%syn;
}
function shioOf(dateStr){const y=+dateStr.slice(0,4),m=+dateStr.slice(5,7),d=+dateStr.slice(8,10),a=moonAge(y,m,d);return{name:SHIO[Math.floor(a)],age:a};}
// "2026-11-02T06:18" → 時刻の通し番号（小数つき）
function tIndex(str){if(!str)return null;const i=S.times.findIndex(x=>x.startsWith(str.slice(0,13)));return i<0?null:i+(+str.slice(14,16))/60;}
// マズメ：日の出・日の入りの前後1時間
const MAZUME_H=1;
function mazumes(d){
  const out=[];if(!d.sun)return out;
  d.sun.time.forEach((_,k)=>{
    const r=tIndex(d.sun.sunrise[k]),st=tIndex(d.sun.sunset[k]);
    if(r!=null)out.push({kind:'朝マズメ',a:r-MAZUME_H,b:r+MAZUME_H,center:r});
    if(st!=null)out.push({kind:'夕マズメ',a:st-MAZUME_H,b:st+MAZUME_H,center:st});
  });

// 潮止まり（流れが一番ゆるむ時刻）と強流のピーク（一番速い時刻）
function slackPeaks(d){
  const k=d.ocean_current_velocity.map(v=>v==null?null:v/0.5144),dir=d.ocean_current_direction;
  const lo0=S.off,hi0=Math.min(S.off+HOURS,k.length-2);
  const vals=k.slice(lo0,hi0+1).filter(v=>v!=null);if(vals.length<3)return[];
  const range=Math.max(...vals)-Math.min(...vals),out=[];
  for(let i=Math.max(1,lo0);i<=hi0;i++){
    const a=k[i-1],b=k[i],c=k[i+1];if(a==null||b==null||c==null)continue;
    const win=k.slice(Math.max(0,i-3),i+4).filter(v=>v!=null);
    const isMin=b<a&&b<=c&&Math.max(...win)-b>=range*0.25,isMax=b>a&&b>=c&&b-Math.min(...win)>=range*0.25;
    if(!isMin&&!isMax)continue;

    if(x<S.off||x>S.off+HOURS)continue;
    const turn=isMin&&dir[i-1]!=null&&dir[i+1]!=null&&angDiff(dir[i-1],dir[i+1])>=90;
    out.push({kind:isMin?(turn?'潮止まり（向きが変わる）':'潮止まり'):'強流ピーク',x,kt:b-0.25*(a-c)*o,min:isMin});

// マズメの時間に潮が動いているか
function mazumeVerdict(i,z){

  for(let x=Math.max(z.a,S.off);x<=Math.min(z.b,S.off+HOURS);x+=1/6){const f=flowClass(i,x);if(!f)continue;n++;if(f.t==='強流')strong++;if(f.t!=='弱流')move++;}
  if(!n)return null;
  if(strong>0)return{mark:'◎',t:'強流が重なる',c:'#ff9a6b'};
  if(move/n>=0.5)return{mark:'○',t:'潮が動いている',c:'#e6f2f3'};

// 「強流／弱流」の判定：表示中の24時間で一番遅い時と一番速い時の間を3つに分け、
// 上の1/3なら強流、下の1/3なら弱流、まん中なら普通。一日中ほとんど流れない日は弱流にします。
const STRONG=2/3, WEAK=1/3, CALM_KT=0.15;
function flowClass(i,t){
  const d=S.spotData[i];if(!d)return null;
  const v=[];for(let j=S.off;j<=S.off+HOURS&&j<d.ocean_current_velocity.length;j++){const x=d.ocean_current_velocity[j];if(x!=null)v.push(x/0.5144);}
  const now=lerp(d.ocean_current_velocity,t);if(now==null||!v.length)return null;
  const kt=now/0.5144,lo=Math.min(...v),hi=Math.max(...v);
  if(hi<CALM_KT)return{t:'弱流',c:'#7fb2ff'};
  const r=(kt-lo)/Math.max(hi-lo,1e-6);
  return r>=STRONG?{t:'強流',c:'#ff7a59'}:r<=WEAK?{t:'弱流',c:'#7fb2ff'}:{t:'普通',c:'#c7d6e4'};
}
// 潮位が上がっているか下がっているか（満潮・干潮の前後20分は「満潮前後」「干潮前後」）
function tideState(i,t){
  const lv=S.spotData[i]?.sea_level_height_msl;if(!lv)return null;
  const ex=tideExtrema(S.times,lv,Math.max(1,Math.floor(t)-3),Math.floor(t)+4);
  for(const e of ex)if(Math.abs(e.x-t)<=1/3)return{t:e.hi?'満潮前後':'干潮前後',ar:'',c:'#e6f2f3'};
  const h=Math.min(Math.floor(t),lv.length-2),a=lv[h],b=lv[h+1];if(a==null||b==null)return null;
  return b>a?{t:'上げ潮',ar:'↑',c:'#63c1ff'}:{t:'下げ潮',ar:'↓',c:'#ffb766'};
}
function nextTide(i,t){ // 次の満潮・干潮
  const lv=S.spotData[i]?.sea_level_height_msl;if(!lv)return null;
  const e=tideExtrema(S.times,lv,Math.max(1,Math.floor(t)),Math.floor(t)+14).find(e=>e.x>t+1/60);if(!e)return null;

function updateKt(){ // 地図上の「〇ノット」表示を今の時刻に合わせる

/* ---------- 潮位の満干 ---------- */
function tideExtrema(times,lv,from,to){
  const out=[];
  for(let i=Math.max(1,from);i<=Math.min(to,lv.length-2);i++){

  const pick=k=>idx.map(j=>d[k][j]);
  const opt=y=>({responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:'index',intersect:false},
    plugins:{legend:{display:false},vline:{idx:cur}},scales:{x:{ticks:{maxTicksLimit:9}},...y}});
  S.charts.push(new Chart($('c3'),{type:'line',plugins:[vLine,bands(i)],data:{labels,datasets:[
    {data:pick('sea_level_height_msl'),borderColor:'#8fb4ff',backgroundColor:'rgba(143,180,255,.15)',fill:'start',tension:.4,pointRadius:0}]},options:opt({y:{title:{display:true,text:'m'}}})}));
  const o4=opt({y:{beginAtZero:true,title:{display:true,text:'ノット'}}});
  o4.plugins.tooltip={callbacks:{label:c=>`${cdir[c.dataIndex]==null?'':dirName(cdir[c.dataIndex])+'へ '}${c.parsed.y.toFixed(2)}ノット`}};
  S.charts.push(new Chart($('c4'),{type:'line',plugins:[vLine,dirMarks(cdir),bands(i)],data:{labels,datasets:[
    {data:kts,borderColor:'#ffa94d',backgroundColor:'rgba(255,169,77,.15)',fill:true,tension:.35,pointRadius:0}]},options:o4}));
  S.charts.push(new Chart($('c1'),{type:'line',plugins:[vLine],data:{labels,datasets:[
    {data:pick('wave_height'),borderColor:'#63c1ff',backgroundColor:'rgba(99,193,255,.2)',fill:true,tension:.3,pointRadius:0,yAxisID:'y'},
    {data:pick('wave_period'),borderColor:'#fff',borderDash:[4,4],borderWidth:1.2,pointRadius:0,tension:.3,yAxisID:'y2'}]},
    options:opt({y:{beginAtZero:true,title:{display:true,text:'m'}},y2:{position:'right',grid:{display:false},title:{display:true,text:'秒'}}})}));
  const ws=pick('wind_speed_10m'),wd=pick('wind_direction_10m');
  const o2=opt({y:{beginAtZero:true,title:{display:true,text:'m/s'}}});
  o2.plugins.tooltip={callbacks:{label:c=>`${dirName(wd[c.dataIndex])} ${c.parsed.y.toFixed(1)}m/s ${shore(wd[c.dataIndex],s.face,c.parsed.y).t}`.trim()}};
  S.charts.push(new Chart($('c2'),{type:'bar',plugins:[vLine],data:{labels,datasets:[{data:ws,backgroundColor:ws.map((v,j)=>shore(wd[j],s.face,v).raw||'#5b7a88'),borderRadius:2}]},options:o2}));
  if(s.custom)$('del').onclick=()=>{if(!confirm(`「${s.name}」を削除しますか？`))return;
    store.set(KEY_CUSTOM,customSpots().filter(c=>!(c.lat===s.lat&&c.lon===s.lon)));closeSheet();loadSpots(false);};
  sh.classList.add('open');
}
function bands(i){ // グラフにマズメの帯と潮止まりの点線を描く
  const d=S.spotData[i],mz=mazumes(d),ev=slackPeaks(d).filter(e=>e.min);
  return{id:'bands',beforeDatasetsDraw(ch){const c=ch.ctx,X=ch.scales.x,{top,bottom,left,right}=ch.chartArea,px=x=>{const h=Math.floor(x),f=x-h;const a=X.getPixelForValue(h),b=X.getPixelForValue(h+1);return a+(b-a)*f;};
    c.save();
    mz.forEach(z=>{const a=Math.max(left,px(z.a-S.off)),b=Math.min(right,px(z.b-S.off));if(b>a){c.fillStyle='rgba(246,183,60,.16)';c.fillRect(a,top,b-a,bottom-top);}});
    c.setLineDash([3,3]);c.strokeStyle='rgba(199,214,228,.6)';c.lineWidth=1;
    ev.forEach(e=>{const x=px(e.x-S.off);c.beginPath();c.moveTo(x,top);c.lineTo(x,bottom);c.stroke();});
    c.restore();}};
}
function dirMarks(dirs){ // 潮流グラフの上に、2時間ごとの流れの向きを小さな矢印で描く
  return{id:'dirmarks',afterDatasetsDraw(ch){const c=ch.ctx,X=ch.scales.x,y=ch.chartArea.top+9;c.save();
    for(let k=0;k<dirs.length;k+=2){if(dirs[k]==null)continue;const r=dirs[k]*Math.PI/180;arrow(c,X.getPixelForValue(k),y,Math.sin(r),Math.cos(r),13,'#ffd29c',1.6);}
    c.restore();}};
}
function closeSheet(){$('sheet').classList.remove('open');S.openSpot=-1;}
map.on('click',closeSheet);

/* ---------- 地点の追加（長押し） ---------- */
map.on('contextmenu',e=>{
  const name=prompt('この場所に地点を追加します。名前を入れてください');if(!name)return;
  const dir=(prompt('浜から見て海はどの方角？（北・北東・東・南東・南・南西・西・北西）\n島や磯で不要なら空欄のままOK','')||'').trim();
  const list=customSpots();list.push({name:name.slice(0,20),lat:+e.latlng.lat.toFixed(4),lon:+e.latlng.lng.toFixed(4),face:DIR8[dir]??null});
  store.set(KEY_CUSTOM,list);loadSpots(false);
});

/* ---------- 時刻 ---------- */
function setTime(t){
  S.t=t;$('slider').value=Math.round((t-S.off)*60/STEP_MIN);const s=S.times[Math.floor(t)];if(!s)return;
  const y=+s.slice(0,4),m=+s.slice(5,7),d=+s.slice(8,10);
  $('date').textContent=`${m}月${d}日（${WEEK[new Date(y,m-1,d).getDay()]}） ${shioOf(s.slice(0,10)).name}`;
  $('hour').textContent=clock(t);
  redraw();updateKt();
  if(S.openSpot>=0&&$('sheet').classList.contains('open'))openSheet(S.openSpot);
}
function nowIndex(){const k=new Date(Date.now()+9*3600e3).toISOString().slice(0,13);const i=S.times.findIndex(x=>x.startsWith(k));return i<0?0:i;}
const stepT=v=>S.off+v*STEP_MIN/60;
$('slider').addEventListener('input',e=>setTime(stepT(+e.target.value)));
$('play').onclick=()=>{
  const b=$('play');
  if(S.timer){clearInterval(S.timer);S.timer=null;b.textContent='▶';b.setAttribute('aria-label','再生');return;}
  b.textContent='❚❚';b.setAttribute('aria-label','停止');
  S.timer=setInterval(()=>{const v=(+$('slider').value+1)%(+$('slider').max+1);setTime(stepT(v));},350);
};
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  S.mode=b.dataset.mode;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  $('arrowNote').textContent=(S.mode==='wind'?'色矢印は風の吹いていく向き':'白矢印は潮の流れていく向き')+'　浜をタップで詳細、地図を長押しで地点を追加';
  $('lgWind').hidden=S.mode!=='wind';
  drawArrows();});

function buildDays(){ // スライダーの上に3時間ごとの目盛り
  const box=$('days');box.innerHTML='';
  for(let k=0;k<=HOURS;k++){const j=S.off+k;if(j>=S.times.length)break;const h=+S.times[j].slice(11,13);if(h%3)continue;
    const sp=document.createElement('span');sp.style.left=`${k/HOURS*100}%`;sp.style.transform='translateX(-50%)';
    sp.textContent=h===0?`${+S.times[j].slice(8,10)}日`:`${h}`;box.appendChild(sp);}
}
$('bar').innerHTML=BANDS.map(c=>`<i style="background:${c}"></i>`).join('');

/* ---------- 読み込み ---------- */
function showMsg(t){const m=$('msg');if(!t){m.hidden=true;return;}m.textContent=t;m.hidden=false;}
function stamp(at){const d=new Date(at);$('updated').textContent=`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')} 取得`;}
async function loadSpots(force){
  try{const r=await fetchSpots(force);S.spots=r.spots;S.spotData=r.data;}
  catch(e){S.spots=[...SPOTS_DEFAULT,...customSpots().map(s=>({...s,custom:true}))];S.spotData=[];console.error(e);}
  drawSpots();
}
const DAYWORD=['今日','明日','あさって'];
function dayStart(k){ // k日目の0時の通し番号
  const d0=S.times[0].slice(0,10),dt=new Date(Date.UTC(+d0.slice(0,4),+d0.slice(5,7)-1,+d0.slice(8,10)+k)).toISOString().slice(0,10);
  const i=S.times.findIndex(x=>x.startsWith(dt+'T00'));return i<0?Math.min(k*24,S.times.length-1-HOURS):i;
}
function todayK(){ // 予報の何日目が「今日」か（キャッシュが前日のものでもずれないように）
  const now=nowIndex();for(let k=0;k<DAYS;k++){if(now<dayStart(k)+24)return k;}return 0;
}
function buildTabs(){
  const box=$('tabs'),k0=todayK();box.innerHTML='';
  for(let j=0;j<TABS;j++){const k=k0+j,o=dayStart(k);if(o+HOURS>S.times.length-1)break;
    const ds=S.times[o].slice(0,10),dd=new Date(+ds.slice(0,4),+ds.slice(5,7)-1,+ds.slice(8,10));
    const b=document.createElement('button');b.setAttribute('role','tab');b.setAttribute('aria-selected',k===S.day);
    b.innerHTML=`<b>${DAYWORD[j]||''}</b> ${dd.getDate()}日(${WEEK[dd.getDay()]}) <span>${shioOf(ds).name}</span>`;
    b.onclick=()=>selectDay(k);box.appendChild(b);}
}
function selectDay(k,t){
  const tod=S.t-S.off;S.day=k;S.off=dayStart(k);buildTabs();buildDays();
  setTime(t!=null?t:Math.min(S.off+HOURS,S.off+Math.max(0,tod)));
}
function useGrid(g){S.grid=g;S.times=g.times;S.fieldCache.clear();stamp(g.at);$('slider').max=HOURS*60/STEP_MIN;}
function startView(keep){ // 最初は「今日」の今の時刻。更新ボタンのときは選んでいた日と時刻のまま
  const k0=todayK();
  if(keep&&S.day>=k0&&S.day<k0+TABS){selectDay(S.day);return;}
  S.off=dayStart(k0);selectDay(k0,Math.floor(Math.max(S.off,nowIndex())));
}
async function loadAll(force){
  showMsg(S.grid?'':'予報を読み込んでいます…');
  try{const had=!!S.grid;const g=await fetchGrid(force);useGrid(g);await loadSpots(force);showMsg('');startView(force&&had);}
  catch(e){
    console.error(e);const c=store.get(KEY_GRID);
    if(c&&!S.grid){useGrid(c);await loadSpots(false);startView(false);showMsg('最新の予報を取得できなかったので、前回取得した予報を表示しています。');setTimeout(()=>showMsg(''),4000);}
    else showMsg(`予報を取得できませんでした（${e.message}）。電波の良い場所で「更新」を押してください。`);
  }
}
$('refresh').onclick=()=>loadAll(true);
map.fitBounds(VIEW);
loadAll(false);
// インストール型アプリ（PWA）として動かすための登録。Claudeのプレビューなどで使えない場所では何もしません
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
